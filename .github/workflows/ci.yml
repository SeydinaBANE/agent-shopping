name: CI

on:
  push:
    branches: [develop, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [develop]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/ruff-action@v3
        with:
          src: "lambda/ scripts/ tests/"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r lambda/requirements-dev.txt
      - run: mypy lambda/ scripts/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r lambda/requirements-dev.txt
      - run: pytest tests/ -v --cov=lambda/ --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: htmlcov/

  widget-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
        working-directory: widget
      - run: npm run build
        working-directory: widget
      - uses: actions/upload-artifact@v4
        with:
          name: widget-dist
          path: widget/dist/

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-shopping:ci --build-arg VERSION=$(cat VERSION) .

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: docker compose up -d --wait
      - name: Wait for Lambda RIE
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/2015-03-31/functions/function/invocations -d '{}' > /dev/null 2>&1 && break
            sleep 1
          done
      - name: Run Artillery smoke tests
        run: npx artillery run artillery/smoke.yml --output artillery/reports/smoke.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artillery-report
          path: artillery/reports/
      - run: docker compose down --remove-orphans
