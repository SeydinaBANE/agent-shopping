name: CI

on:
  push:
    branches: [develop, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [develop]

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/ruff-action@v1
        with:
          src: "lambda/ scripts/ tests/"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r lambda/requirements-dev.txt
      - run: mypy lambda/ scripts/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r lambda/requirements-dev.txt
      - run: pytest tests/ -v --cov=lambda/ --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: htmlcov/

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-shopping:ci --build-arg VERSION=$(cat VERSION) .
      - run: |
          docker run --rm agent-shopping:ci \
            python -c "import handler; assert hasattr(handler, 'lambda_handler')"
